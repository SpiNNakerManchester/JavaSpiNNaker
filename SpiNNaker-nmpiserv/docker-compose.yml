services:
  nmpi:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        DOCKER_GROUP_ID: ${DOCKER_GROUP_ID}
    container_name: nmpi-host
    ports:
      - "9090:9090"
    networks:
      - nmpi-network
    volumes:
      - ${NMPI_PROPERTIES}:/app/nmpi.properties
      - ${EXECUTE_PYNN}:/app/execute_pynn.bash
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DATA_PATH}:/mnt/data/

networks:
  nmpi-network:
    name: nmpi-network
